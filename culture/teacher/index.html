<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Багшийн самбар · Таасан уу?</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#000;--paper:#f4f2ed;--line:rgba(0,0,0,.12);--muted:rgba(0,0,0,.55)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font:15px/1.5 'Onest',Arial,sans-serif;padding:24px 16px 60px}
  main{max-width:980px;margin:0 auto}
  a{color:inherit}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.04em}
  h2{font-size:17px;font-weight:800;margin:28px 0 10px}
  .muted{color:var(--muted)}
  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
  label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  input{height:42px;border:1.5px solid rgba(0,0,0,.2);border-radius:6px;padding:0 12px;font:600 16px 'Onest',Arial,sans-serif;text-transform:uppercase;width:180px}
  button{height:42px;padding:0 18px;border:none;border-radius:6px;background:#000;color:var(--paper);font:700 14px 'Onest',Arial,sans-serif;cursor:pointer}
  button.ghost{background:transparent;color:#000;border:1.5px solid #000;height:32px;padding:0 10px;font-size:12.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
  .card span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
  th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:#faf9f6}
  td{padding:9px 10px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:middle}
  td.act{white-space:nowrap;text-align:right}
  tr.idle td{color:var(--muted)}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:#000;color:var(--paper)}
  .tag.warn{background:#c8352b}
  .err{color:#c8352b;font-weight:600;margin-top:10px}
  .wrap{overflow-x:auto}
  ul.ms{list-style:none;display:flex;gap:8px;flex-wrap:wrap}
  ul.ms li{background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Багшийн самбар</h1><a class="muted" href="/culture/taasan-uu/">Таасан уу? тоглоом →</a></div>
  <form id="login">
    <label>ангийн код<input name="code" maxlength="6" required placeholder="K7QX2M"></label>
    <label>багшийн код<input name="teacher" maxlength="8" required placeholder="••••••••" type="password"></label>
    <button type="submit">нээх</button>
    <p class="muted" style="flex-basis:100%;font-size:12.5px">Кодуудыг GRIT-ээс авна. Багшийн кодыг сурагчдад бүү өгөөрэй.</p>
  </form>
  <p class="err" id="err"></p>
  <div id="out"></div>
</main>
<script>
const TU_API = window.TU_API || { url: 'https://wrjgihdvjwriurdiotih.supabase.co', key: 'sb_publishable_4SDR_v8yrRdlm0k97LqwaQ_tugAqXPN' };
async function rpc(fn,args){let r,j;try{const h={'Content-Type':'application/json',apikey:TU_API.key};if(/^eyJ/.test(TU_API.key))h.Authorization='Bearer '+TU_API.key;
  r=await fetch(TU_API.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});j=await r.json().catch(()=>null)}catch(e){throw new Error('network')}
  if(!r.ok)throw new Error((j&&j.message)||'network');if(j&&j.error)throw new Error(j.error);return j}
const MSG={teacher:'Ангийн код эсвэл багшийн код буруу байна.',pin_format:'PIN 4 оронтой тоо байна.',network:'Сүлжээний алдаа. Дахин оролдоно уу.'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EPOCH=new Date(2026,10,1);
const dayDate=n=>{if(!n)return '—';const d=new Date(EPOCH);d.setDate(d.getDate()+n-1);return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
let cred=null,data=null;
try{cred=JSON.parse(sessionStorage.getItem('tu_teacher')||'null')}catch(e){}
function draw(){
  const c=data.class,today=data.today;
  const ms=(c.milestones||[]).map(m=>`<li>${esc(['','Аравт','Зуут','Мянгат','Түмэн','Хаан'][m.lvl]||m.lvl)} · ${esc(m.reached_on)}</li>`).join('');
  let h=`<h2>${esc(c.school)} · ${esc(c.name)} анги <span class="muted">(сурагчийн код: ${esc(c.code)})</span></h2>
  <div class="cards">
    <div class="card"><b>${esc(c.rank)}</b><span>ангийн цол (80% дүрэм)</span></div>
    <div class="card"><b>${c.avg_points}</b><span>нэг сурагчид ногдох дундаж оноо</span></div>
    <div class="card"><b>${c.size}</b><span>бүртгэлтэй сурагч</span></div>
    <div class="card"><b>${c.active_week_pct}%</b><span>энэ 7 хоногт тоглосон</span></div>
  </div>
  ${ms?`<h2>Хүрсэн цолууд</h2><ul class="ms">${ms}</ul>`:''}
  <h2>Сурагчид</h2><div class="wrap"><table><tr><th>нэр</th><th>цол</th><th>оноо</th><th>өдөр</th><th>сүүлд тоглосон</th><th></th></tr>`+
  data.members.map(m=>`<tr class="${m.last_day&&today-m.last_day<=2?'':'idle'}"><td><b>${esc(m.nickname)}</b> ${m.locked?'<span class="tag warn">түгжигдсэн</span>':''}</td><td>${esc(m.rank)}</td><td>${m.points}</td><td>${m.days}</td><td>${dayDate(m.last_day)}</td>
    <td class="act"><button class="ghost" data-pin="${m.id}" data-n="${esc(m.nickname)}">PIN солих</button> <button class="ghost" data-del="${m.id}" data-n="${esc(m.nickname)}">хасах</button></td></tr>`).join('')+`</table></div>
  <p class="muted" style="margin-top:8px;font-size:12.5px">Саарал мөр = сүүлийн 3 хоногт тоглоогүй. <button class="ghost" id="csv">CSV татах</button></p>
  <h2>Сургуулийн ангиуд</h2><div class="wrap"><table><tr><th>анги</th><th>цол</th><th>дундаж оноо</th><th>сурагч</th><th>7 хоногт</th></tr>`+
  (data.school||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.rank)}</td><td>${x.avg_points}</td><td>${x.size}</td><td>${x.active_week_pct}%</td></tr>`).join('')+`</table></div>`;
  document.getElementById('out').innerHTML=h}
async function open(fn='tu_teacher',extra={}){
  document.getElementById('err').textContent='';
  try{data=await rpc(fn,{p_code:cred.code,p_teacher:cred.teacher,...extra});sessionStorage.setItem('tu_teacher',JSON.stringify(cred));draw()}
  catch(e){document.getElementById('err').textContent=MSG[e.message]||MSG.network;if(e.message==='teacher'){sessionStorage.removeItem('tu_teacher');document.getElementById('out').innerHTML=''}}}
document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);cred={code:d.get('code').trim().toUpperCase(),teacher:d.get('teacher').trim().toUpperCase()};open()});
document.getElementById('out').addEventListener('click',e=>{
  const pin=e.target.closest('[data-pin]'),del=e.target.closest('[data-del]');
  if(pin){const v=prompt(`${pin.dataset.n}-ийн шинэ PIN (4 тоо):`);if(v)open('tu_teacher_pin',{p_player:pin.dataset.pin,p_pin:v.trim()})}
  if(del&&confirm(`${del.dataset.n}-г ангиас хасах уу? Түүний оноо ангид тооцогдохоо болино.`))open('tu_teacher_remove',{p_player:del.dataset.del});
  if(e.target.id==='csv'){const rows=[['нэр','цол','оноо','өдөр','сүүлд тоглосон']].concat(data.members.map(m=>[m.nickname,m.rank,m.points,m.days,dayDate(m.last_day)]));
    const blob=new Blob(['﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${data.class.name}-taasan-uu.csv`;document.body.appendChild(a);a.click();a.remove()}});
if(cred){document.querySelector('[name=code]').value=cred.code;open()}
</script>
</body>
</html>
