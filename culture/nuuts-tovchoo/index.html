<style>
  :root{--bg:#f4efe4;--paper:#fbf8f1;--ink:#17130e;--dim:rgba(23,19,14,.6);--faint:rgba(23,19,14,.14);--red:#a8442f;--gold:#b7862c;--ok:#3f7d2c;--no:#b3392b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Onest',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body.reading{overflow:hidden}
  button{font-family:inherit;color:inherit}
  a{color:inherit}

  header{position:sticky;top:0;z-index:5;background:rgba(244,239,228,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--faint)}
  .bar{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
  .lead{display:flex;align-items:center;gap:10px;min-width:0}
  .back{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--faint)}
  .back:hover{border-color:var(--dim)}
  .back svg,.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
  .logo{width:36px;height:36px;flex:none}
  .logo path{fill:var(--ink)}
  .wm{line-height:1}
  .wm b{display:flex;align-items:center;gap:5px;font-weight:800;font-size:20px;letter-spacing:-.04em;white-space:nowrap}
  .wmh{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--dim);white-space:nowrap}
  .xs{width:12px;height:12px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
  .nav{display:flex;gap:8px;flex:none}
  .nav button{height:38px;min-width:38px;border-radius:999px;border:1px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;font-size:13.5px;font-weight:700}
  .nav [data-tu-account]{padding:0 14px}
  .nav [data-tu-account].is-in{padding:0;width:38px;border:0}
  .nav [data-tu-account] .tu-av{width:38px;height:38px}
  @media(max-width:420px){.bar{padding:10px 12px}.brand{gap:8px}.logo{width:30px;height:30px}.wm b{font-size:16px}.back{width:34px;height:34px}.lead{gap:6px}}

  main{max-width:760px;margin:0 auto;padding:22px 16px 40px}
  .hero{display:grid;gap:18px}
  .hero__art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#e7dcc6}
  .hero__art img{width:100%;height:100%;object-fit:cover;display:block}
  .kicker{font-size:12.5px;font-weight:700;color:var(--red);letter-spacing:.02em}
  h1.title{font-family:'PT Serif',Georgia,serif;font-weight:700;font-size:clamp(30px,7vw,46px);line-height:1.05;letter-spacing:-.02em;margin-top:6px}
  .hero p.intro{font-size:16.5px;line-height:1.6;color:rgba(23,19,14,.8);margin-top:10px;max-width:60ch}
  .hero__row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;background:none}
  .btn--dark{background:var(--ink);color:var(--paper)}
  .btn[disabled]{opacity:.35;cursor:default}
  .meter{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--dim)}
  .meter i{display:block;width:110px;height:6px;border-radius:6px;background:var(--faint);overflow:hidden}
  .meter i b{display:block;height:100%;background:var(--red);border-radius:6px;transition:width .4s}

  h2.sec{font-family:'PT Serif',Georgia,serif;font-size:24px;margin:38px 0 14px;letter-spacing:-.01em}
  .chapters{list-style:none;display:grid;gap:12px}
  @media(min-width:620px){.chapters{grid-template-columns:1fr 1fr}}
  .ch{display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid var(--faint);border-radius:14px;background:var(--paper);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
  .ch:hover{border-color:rgba(23,19,14,.35);transform:translateY(-2px)}
  .ch__art{position:relative;aspect-ratio:16/9;background:#e7dcc6;overflow:hidden}
  .ch__art img{width:100%;height:100%;object-fit:cover;display:block}
  .ch__no{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;background:rgba(251,248,241,.92);font-size:12px;font-weight:700}
  .ch__done{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:999px;background:var(--ok);color:#fff;font-size:12px;font-weight:700}
  .ch__body{padding:14px 16px 16px}
  .ch__t{font-family:'PT Serif',Georgia,serif;font-weight:700;font-size:19px;line-height:1.2}
  .ch__s{font-size:14px;line-height:1.45;color:var(--dim);margin-top:5px}
  .ch__ref{font-size:12px;font-weight:600;color:var(--gold);margin-top:8px}

  .about{margin-top:38px;padding:20px;border-radius:14px;background:var(--paper);border:1px solid var(--faint)}
  .about h2{font-family:'PT Serif',Georgia,serif;font-size:20px;margin-bottom:8px}
  .about p{font-size:15px;line-height:1.6;color:rgba(23,19,14,.8)}
  .about p+p{margin-top:8px}
  .glossary{margin-top:14px;display:grid;gap:8px}
  .glossary details{border-top:1px solid var(--faint);padding-top:8px}
  .glossary summary{cursor:pointer;font-weight:700;font-size:15px}
  .glossary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14.5px;line-height:1.45}
  .glossary dt{font-weight:700}
  .glossary dd{color:rgba(23,19,14,.75)}
  .glossary dl.people dt{color:#7a5a16}
  .foot{font-size:12px;color:var(--dim);text-align:center;margin-top:28px;line-height:1.6}
  .foot a{text-underline-offset:3px}

  /* reader */
  .rd{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
  .rd.open{display:flex}
  .rd__top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--faint)}
  .rd__ttl{flex:1;min-width:0}
  .rd__ttl small{display:block;font-size:11.5px;font-weight:600;color:var(--dim)}
  .rd__ttl b{display:block;font-family:'PT Serif',Georgia,serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:14px}
  .ibtn:hover{border-color:var(--dim)}
  .rd__prog{height:3px;background:var(--faint)}
  .rd__prog b{display:block;height:100%;background:var(--red);transition:width .3s}
  .rd__scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .rd__page{max-width:720px;margin:0 auto;padding:16px 16px 24px;animation:pg .3s ease-out}
  @keyframes pg{from{opacity:0;transform:translateX(var(--dx,12px))}}
  .rd__art{border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:#e7dcc6;box-shadow:0 10px 30px -18px rgba(23,19,14,.5)}
  .rd__art img{width:100%;height:100%;object-fit:cover;display:block}
  .noimg{display:grid;place-items:center;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#efe4cd,#dccaa6);color:rgba(23,19,14,.35);font-family:'PT Serif',Georgia,serif;font-size:64px}
  .rd__sec{display:inline-block;margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.02em}
  .rd__text{font-family:'PT Serif',Georgia,serif;font-size:var(--fs,19px);line-height:1.65}
  .rd.big .rd__text{--fs:22px}
  .gl{font:inherit;background:none;border:0;border-bottom:2px dotted var(--red);cursor:pointer;padding:0;color:inherit}
  .gl:hover,.gl.on{background:rgba(168,68,47,.1)}
  .fact{margin-top:4px;padding:20px;border-radius:14px;background:var(--paper);border:1px solid var(--faint)}
  .fact__h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--red);margin-bottom:10px}
  .quiz__q{font-family:'PT Serif',Georgia,serif;font-size:22px;line-height:1.3;margin:6px 0 16px}
  .opts{display:grid;gap:10px}
  .opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--faint);background:var(--paper);font-size:16px;font-weight:600;cursor:pointer}
  .opt:hover:not([disabled]){border-color:var(--ink)}
  .opt.ok{border-color:var(--ok);background:#e8f1df;color:#24501a}
  .opt.no{border-color:var(--no);background:#f6e2dd;color:#7d241a}
  .opt[disabled]{cursor:default}
  .verdict{margin-top:14px;font-size:15.5px;line-height:1.5;font-weight:600}
  .end{text-align:center;padding:26px 6px 6px}
  .end__seal{width:74px;height:74px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-family:'PT Serif',Georgia,serif;font-size:30px;font-weight:700}
  .end h3{font-family:'PT Serif',Georgia,serif;font-size:24px}
  .end p{color:var(--dim);margin-top:6px;line-height:1.5}
  .end .btn{margin-top:18px}
  .rd__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--faint);max-width:720px;width:100%;margin:0 auto}
  .rd__foot .btn{height:46px;padding:0 18px}
  .rd__count{font-size:13px;font-weight:600;color:var(--dim)}
  .pp{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:2px solid rgba(183,134,44,.55)}
  .pp:hover,.pp.on{background:rgba(183,134,44,.14)}
  .gl{cursor:help}
  .tip{position:absolute;z-index:40;width:min(320px,calc(100vw - 24px));padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:0 16px 40px -12px rgba(0,0,0,.45);display:none;pointer-events:auto}
  .tip.open{display:block;animation:tp .15s ease-out}
  @keyframes tp{from{opacity:0;transform:translateY(4px)}}
  .tip small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
  .tip b{display:block;font-size:15.5px;margin-bottom:4px}
  .tip span{display:block;font-size:14px;line-height:1.45;opacity:.88}
  .lang{font-size:13px;font-weight:700}
</style>
</head>

<script>
(function () {
  const BOOK = window.NT_BOOK, GLOSS = window.NT_GLOSS, PEOPLE = window.NT_PEOPLE;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  // the site keeps its language in grit-lang (plain text, not JSON)
  let lang = "mn";
  try { if (localStorage.getItem("grit-lang") === "en") lang = "en"; } catch (e) {}
  const UI = {
    mn: {
      brandSub: "Нууц товчоо", back: "GRIT Culture руу буцах", close: "Хаах", size: "Үсгийн хэмжээ",
      heroAlt: "Бөртэ чоно, Гуа марал хоёр их усыг гэтэлж ирээд Бурхан халдун руу явж буй зураг",
      kicker: "Зурагт ном · 7 бүлэг · бүлэг бүрийг 5 минут орчим уншина",
      title: "Монголын нууц товчоо",
      intro: "Найман зуун жилийн өмнө бичигдсэн монголчуудын хамгийн эртний түүхэн ном. Тэмүжин хэмээх хүү хэрхэн Чингис хаан болсон түүхийг энгийн үгээр, зурагтай хүүрнэв. Хүний нэр, тодруулсан үгэн дээр хулганаа аваачих эсвэл дарахад тайлбар нь гарна.",
      start: "Уншиж эхлэх", cont: "Үргэлжлүүлэх", again: "Дахин унших", of: "бүлэг",
      chapters: "Бүлгүүд", chNo: (n) => `${n}-р бүлэг`, done: "✓ Уншсан", src: "Нууц товчоо",
      aboutH: "Энэ номын тухай",
      about1: "“Монголын нууц товчоо” нь 13-р зуунд бичигдсэн. Эх зохиол нь шүлэглэсэн, хуучин үгтэй тул хүүхдэд уншихад хэцүү. Энд бид гол үйл явдлыг өөрсдийн үгээр товчилж, энгийн хэлээр бичлээ. Хуудас бүрт эх зохиолын хэдэн дугаар зүйлээс (§) авсныг тэмдэглэсэн тул дэлгэрэнгүйг эх зохиолоос уншиж болно.",
      about2: "Зургуудыг ном уншихад туслах зорилгоор зурсан бөгөөд түүхэн хүмүүсийн жинхэнэ дүр төрх биш.",
      peopleH: "Номын хүмүүс", glossH: "Хэцүү үгсийн тайлбар толь",
      foot: "Бүлэг бүрийн асуултад зөв хариулбал GRIT Culture-ийн онооны самбарт 2 оноо нэмэгдэнэ.",
      prev: "Өмнөх", next: "Дараах", finish: "Дуусгах", fact: "Мэдэх үү?", quiz: "Шалгаад үзье",
      right: "Зөв! Сайн уншжээ.", wrong: (a) => `Зөв хариулт: ${a}. Дахин нэг уншаад үзээрэй.`,
      endH: (t) => `${t}: уншиж дууслаа`, nextCh: (t) => `Дараагийн бүлэг: “${t}”`, nextBtn: "Дараагийн бүлэг",
      allDone: "Та номыг бүхэлд нь уншиж дуусгалаа. Баяр хүргэе!", play: "Хэн бэ? тоглоом тоглох",
      person: "Хүн", word: "Үгийн тайлбар", langBtn: "EN", langAria: "Switch to English",
    },
    en: {
      brandSub: "Secret History", back: "Back to GRIT Culture", close: "Close", size: "Text size",
      heroAlt: "Börte Chino and Gua Maral ride toward Burkhan Khaldun after crossing a great water",
      kicker: "Picture book · 7 chapters · about 5 minutes a chapter",
      title: "The Secret History of the Mongols",
      intro: "The oldest Mongolian history book, written about eight hundred years ago, retold in plain words with pictures: how a boy called Temüjin became Chinggis Khaan. Point at or tap a name or a highlighted word to see what it means.",
      start: "Start reading", cont: "Continue", again: "Read again", of: "chapters",
      chapters: "Chapters", chNo: (n) => `Chapter ${n}`, done: "✓ Read", src: "Secret History",
      aboutH: "About this book",
      about1: "“The Secret History of the Mongols” was written in the 13th century. The original is partly in verse and full of old words, so it is hard for children to read. Here we retell the main events briefly, in our own plain words. Every page notes the paragraphs (§) of the original it comes from, so you can read more in the full text.",
      about2: "The pictures are drawn to help readers follow the story. They do not show what the historical people really looked like.",
      peopleH: "People in the book", glossH: "Glossary of hard words",
      foot: "Answer each chapter's question correctly to add 2 points to the GRIT Culture leaderboard.",
      prev: "Back", next: "Next", finish: "Finish", fact: "Did you know?", quiz: "Check yourself",
      right: "Correct! Well read.", wrong: (a) => `The answer is: ${a}. Try reading it once more.`,
      endH: (t) => `${t}: finished`, nextCh: (t) => `Next chapter: “${t}”`, nextBtn: "Next chapter",
      allDone: "You have read the whole book. Congratulations!", play: "Play Хэн бэ?",
      person: "Person", word: "Word", langBtn: "МН", langAria: "Монгол хэл рүү шилжих",
    },
  };
  const T = (k, ...a) => { const v = UI[lang][k]; return typeof v === "function" ? v(...a) : v; };
  const tx = (o) => (o && typeof o === "object" ? o[lang] || o.mn : o);

  let done = store.get("nt_done", {});      // chapter id -> true once its question is answered
  let pos = store.get("nt_pos", null);      // { c, p } last place read
  const imgOf = (c, i) => c.pages[i].img || `${c.id}-${i + 1}`;
  const img = (name, extra) => `<img src="/assets/img/nuuts/${name}.webp?v=2" alt="" ${extra || ""} width="1080" height="720" decoding="async" onerror="this.outerHTML='<div class=noimg>§</div>'">`;

  // ------------------------------------------------------------ text with names and hard words
  const CY = "А-Яа-яӨөҮүЁё";
  const nameOf = (k) => (lang === "en" ? PEOPLE[k].en : k);
  let peopleRe = null, peopleRel = null;
  function peopleRegex() {
    if (peopleRel === lang) return peopleRe;
    const names = Object.keys(PEOPLE).map((k) => [nameOf(k), k]).sort((a, b) => b[0].length - a[0].length);
    const letters = lang === "en" ? "A-Za-zÀ-ž'" : CY;
    peopleRe = { re: new RegExp(`(?<![${letters}])(${names.map((n) => n[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})([${CY}]*)`, "g"), map: Object.fromEntries(names) };
    peopleRel = lang;
    return peopleRe;
  }
  function words(t) {
    const seen = new Set(), keep = [];
    const hold = (h) => `\u0001${keep.push(h) - 1}\u0002`;
    let s = esc(t)
      .replace(/{{(.+?)}}([А-Яа-яӨөҮүЁё]*)/g, (m, k, tail) => { const [key, label] = k.split("|"); return hold(`<button type="button" class="gl" data-gl="${esc(key)}">${label || key}${tail}</button>`); })
      .replace(/\[\[(.+?)\]\]([А-Яа-яӨөҮүЁё]*)/g, (m, k, tail) => { const [key, label] = k.split("|"); seen.add(key); return hold(`<button type="button" class="pp" data-pp="${esc(key)}">${label || key}${tail}</button>`); });
    // any other first mention of a known person on this page gets the same popover
    const P = peopleRegex();
    s = s.split(/(\u0001\d+\u0002)/).map((part) => (part.charCodeAt(0) === 1 ? part : part.replace(P.re, (m, name, tail) => {
      const key = P.map[name];
      if (!key || seen.has(key)) return m;
      seen.add(key);
      return `<button type="button" class="pp" data-pp="${esc(key)}">${name}${tail}</button>`;
    }))).join("");
    return s.replace(/\u0001(\d+)\u0002/g, (m, i) => keep[i]);
  }

  // ------------------------------------------------------------ static text, language
  function paintStatic() {
    document.documentElement.lang = lang;
    document.documentElement.setAttribute("data-lang", lang);
    document.title = lang === "en" ? "The Secret History of the Mongols: a picture book | GRIT Culture" : "Монголын нууц товчоо: зурагт ном | GRIT Culture";
    document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = T(e.dataset.t); });
    document.querySelectorAll("[data-t-aria]").forEach((e) => e.setAttribute("aria-label", T(e.dataset.tAria)));
    document.querySelectorAll("[data-t-alt]").forEach((e) => e.setAttribute("alt", T(e.dataset.tAlt)));
    [$("langBtn"), $("rdLang")].forEach((b) => { b.textContent = T("langBtn"); b.setAttribute("aria-label", T("langAria")); });
    const gl = Object.keys(GLOSS).map((k) => [lang === "en" ? GLOSS[k].en : k, lang === "en" ? GLOSS[k].enx : GLOSS[k].mn]);
    $("gloss").innerHTML = gl.sort((a, b) => a[0].localeCompare(b[0], lang)).map(([w, d]) => `<dt>${esc(w)}</dt><dd>${esc(d)}</dd>`).join("");
    const pp = Object.keys(PEOPLE).map((k) => [nameOf(k), lang === "en" ? PEOPLE[k].enx : PEOPLE[k].mn]);
    $("people").innerHTML = pp.sort((a, b) => a[0].localeCompare(b[0], lang)).map(([w, d]) => `<dt>${esc(w)}</dt><dd>${esc(d)}</dd>`).join("");
    paintList();
    if (R.classList.contains("open")) paint();
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("grit-lang", l); } catch (e) {}
    hideTip();
    paintStatic();
    window.GRIT_TU && window.GRIT_TU.reload && window.GRIT_TU.reload();
  }

  // ------------------------------------------------------------ chapter list
  function paintList() {
    $("chapters").innerHTML = BOOK.map((c, i) => `<li><button class="ch" data-ch="${i}">
      <div class="ch__art">${img(imgOf(c, 0), 'loading="lazy"')}<span class="ch__no">${T("chNo", i + 1)}</span>${done[c.id] ? `<span class="ch__done">${T("done")}</span>` : ""}</div>
      <div class="ch__body"><div class="ch__t">${esc(tx(c.title))}</div><div class="ch__s">${esc(tx(c.sub))}</div><div class="ch__ref">${T("src")}, ${esc(c.ref)}</div></div>
    </button></li>`).join("");
    const n = BOOK.filter((c) => done[c.id]).length;
    $("meterBar").style.width = (n / BOOK.length * 100) + "%";
    $("meterTxt").textContent = `${n}/${BOOK.length} ${T("of")}`;
    $("startBtn").textContent = n === BOOK.length ? T("again") : pos || n ? T("cont") : T("start");
  }

  // ------------------------------------------------------------ reader
  const R = $("reader");
  let ci = 0, pi = 0, picked = null, dir = 1;
  const total = () => BOOK[ci].pages.length + 1;          // pages + the question
  function open(c, p) {
    ci = c; pi = p || 0; picked = null; dir = 1;
    R.classList.add("open"); document.body.classList.add("reading");
    paint();
  }
  function close() {
    R.classList.remove("open"); document.body.classList.remove("reading"); hideTip();
    paintList();
  }
  function paint() {
    const c = BOOK[ci], last = pi === total() - 1, end = pi >= total();
    $("rdNo").textContent = `${T("chNo", ci + 1)} · ${T("src")}, ${c.ref}`;
    $("rdTitle").textContent = tx(c.title);
    $("rdProg").style.width = Math.min(100, (pi + 1) / total() * 100) + "%";
    $("rdCount").textContent = end ? "" : `${pi + 1} / ${total()}`;
    let h;
    if (end) {
      const next = BOOK[ci + 1];
      h = `<div class="end"><div class="end__seal">${ci + 1}</div><h3>${esc(T("endH", tx(c.title)))}</h3>
        <p>${next ? esc(T("nextCh", tx(next.title))) : esc(T("allDone"))}</p>
        ${next ? `<button class="btn btn--dark" data-go="${ci + 1}">${T("nextBtn")}</button>` : `<a class="btn btn--dark" href="/culture/hen-be/">${T("play")}</a>`}</div>`;
    } else if (last) {
      const q = c.check;
      h = `<p class="rd__sec">${T("quiz")}</p><p class="quiz__q">${esc(tx(q.q))}</p><div class="opts">${q.a.map((a, i) => {
        const cls = picked == null ? "" : i === q.ok ? " ok" : i === picked ? " no" : "";
        return `<button class="opt${cls}" data-opt="${i}"${picked != null ? " disabled" : ""}>${esc(tx(a))}</button>`;
      }).join("")}</div>${picked != null ? `<p class="verdict">${picked === q.ok ? T("right") : esc(T("wrong", tx(q.a[q.ok])))}</p>` : ""}`;
    } else {
      const p = c.pages[pi];
      h = p.fact
        ? `<div class="fact"><div class="fact__h"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>${T("fact")}</div><p class="rd__text">${words(tx(p))}</p></div>`
        : `<div class="rd__art">${img(imgOf(c, pi))}</div><span class="rd__sec">${T("src")}, ${esc(tx(p.sec))}</span><p class="rd__text">${words(tx(p))}</p>`;
    }
    const pg = $("rdPage");
    pg.style.setProperty("--dx", dir * 12 + "px");
    pg.innerHTML = h; pg.style.animation = "none"; void pg.offsetWidth; pg.style.animation = "";
    $("rdScroll").scrollTop = 0;
    $("prevBtn").textContent = T("prev");
    $("prevBtn").disabled = pi === 0 && ci === 0;
    $("nextBtn").style.visibility = end ? "hidden" : "";
    $("nextBtn").disabled = last && picked == null && !done[c.id];
    $("nextBtn").textContent = last ? T("finish") : T("next");
    hideTip();
    if (!end) { pos = { c: ci, p: pi }; store.set("nt_pos", pos); }
    const np = c.pages[pi + 1];
    if (np && !np.fact) { const im = new Image(); im.src = `/assets/img/nuuts/${imgOf(c, pi + 1)}.webp?v=2`; }
  }
  function go(d) {
    dir = d;
    if (d < 0) {
      if (pi > 0) pi--; else if (ci > 0) { ci--; pi = total() - 1; } else return;
    } else {
      if (pi === total() - 1 && picked == null && !done[BOOK[ci].id]) return;
      pi++;
      if (pi > total()) return;
    }
    if (pi === total() - 1) picked = null;
    paint();
  }
  function answer(i) {
    if (picked != null) return;
    const c = BOOK[ci];
    picked = i;
    if (i === c.check.ok) {
      done[c.id] = true; store.set("nt_done", done);
      window.GRIT_TU && window.GRIT_TU.award("book", 1, 1, "nt-" + c.id);
      if (BOOK.every((b) => done[b.id])) store.set("nt_pos", null);
    }
    paint();
  }

  // ------------------------------------------------------------ popovers for names and words
  const tip = $("tip");
  let tipFor = null, hideT = 0;
  function showTip(el) {
    clearTimeout(hideT);
    const isP = !!el.dataset.pp, k = el.dataset.pp || el.dataset.gl;
    const d = isP ? PEOPLE[k] : GLOSS[k];
    if (!d) return;
    document.querySelectorAll(".gl.on,.pp.on").forEach((b) => b.classList.remove("on"));
    el.classList.add("on"); tipFor = el;
    tip.querySelector("small").textContent = isP ? T("person") : T("word");
    tip.querySelector("b").textContent = isP ? nameOf(k) : lang === "en" ? d.en : k.charAt(0).toUpperCase() + k.slice(1);
    tip.querySelector("span").textContent = lang === "en" ? d.enx : d.mn;
    tip.classList.add("open");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(12, Math.min(x, document.documentElement.clientWidth - w - 12));
    const below = r.bottom + 10 + h < window.innerHeight - 70;
    const y = below ? r.bottom + 8 : r.top - h - 8;
    tip.style.left = x + window.scrollX + "px";
    tip.style.top = y + window.scrollY + "px";
  }
  function hideTip() { tip.classList.remove("open"); tipFor = null; document.querySelectorAll(".gl.on,.pp.on").forEach((b) => b.classList.remove("on")); }
  const hover = matchMedia("(hover: hover) and (pointer: fine)");
  document.addEventListener("mouseover", (e) => {
    if (!hover.matches) return;
    const el = e.target.closest(".gl,.pp");
    if (el) { if (el !== tipFor) showTip(el); else clearTimeout(hideT); }
    else if (e.target.closest(".tip")) clearTimeout(hideT);
  });
  document.addEventListener("mouseout", (e) => {
    if (!hover.matches || !tipFor) return;
    const to = e.relatedTarget;
    if (to && (to.closest && (to.closest(".tip") || to.closest(".gl,.pp") === tipFor))) return;
    clearTimeout(hideT); hideT = setTimeout(hideTip, 180);
  });
  $("rdScroll").addEventListener("scroll", () => tipFor && hideTip(), { passive: true });
  window.addEventListener("resize", () => tipFor && hideTip());

  // ------------------------------------------------------------ events
  $("chapters").addEventListener("click", (e) => { const b = e.target.closest("[data-ch]"); if (b) open(+b.dataset.ch, 0); });
  $("startBtn").addEventListener("click", () => {
    if (pos && !BOOK.every((b) => done[b.id])) return open(pos.c, pos.p);
    const first = BOOK.findIndex((b) => !done[b.id]);
    open(first < 0 ? 0 : first, 0);
  });
  document.addEventListener("click", (e) => {
    const w = e.target.closest(".gl,.pp");
    if (w) { e.preventDefault(); return w === tipFor && !hover.matches ? hideTip() : showTip(w); }
    if (!e.target.closest(".tip")) hideTip();
  });
  R.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-close]")) return close();
    const o = t.closest("[data-opt]"); if (o) return answer(+o.dataset.opt);
    const g = t.closest("[data-go]"); if (g) return open(+g.dataset.go, 0);
  });
  tip.addEventListener("click", hideTip);
  [$("langBtn"), $("rdLang")].forEach((b) => b.addEventListener("click", () => setLang(lang === "mn" ? "en" : "mn")));
  $("prevBtn").addEventListener("click", () => go(-1));
  $("nextBtn").addEventListener("click", () => go(1));
  $("sizeBtn").addEventListener("click", () => { const on = R.classList.toggle("big"); store.set("nt_big", on); });
  if (store.get("nt_big", false)) R.classList.add("big");
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && tipFor) return hideTip();
    if (!R.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });
  let sx = null, sy = 0;
  $("rdScroll").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("rdScroll").addEventListener("touchend", (e) => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.querySelector("[data-tu-account]").addEventListener("click", () => window.GRIT_TU && window.GRIT_TU.openAccount());
  paintStatic();
  const deep = /^#(\d)$/.exec(location.hash); if (deep && BOOK[deep[1] - 1]) open(deep[1] - 1, 0);

  if (/(^|\.)grit\.mn$/.test(location.hostname)) {
    let ref = ''; try { const r = new URL(document.referrer); if (r.hostname !== location.hostname) ref = r.hostname; } catch (e) {}
    fetch('https://wrjgihdvjwriurdiotih.supabase.co/rest/v1/rpc/site_view', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_4SDR_v8yrRdlm0k97LqwaQ_tugAqXPN' },
      body: JSON.stringify({ p_path: location.pathname, p_ref: ref, p_device: matchMedia('(max-width: 800px)').matches ? 'mobile' : 'desktop', p_lang: 'mn' }) }).catch(() => {});
  }
})();
</script>
</body>
