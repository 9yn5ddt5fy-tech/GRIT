<style>
  :root{--bg:#000;--ink:#f4f2ed;--dim:rgba(244,242,237,.55);--faint:rgba(244,242,237,.14);--cell:#121212;--ok:#8fd14f;--no:#ff7a6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Onest',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  header{width:100%;border-bottom:1px solid var(--faint);position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:5}
  .bar{max-width:540px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
  .brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;min-width:0}
  .logo{width:38px;height:38px;flex:none}.logo path{fill:var(--ink)}
  .wm{line-height:1}
  .wm b{display:flex;align-items:center;gap:5px;font-weight:800;font-size:21px;letter-spacing:-.04em;white-space:nowrap}
  .wmh{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--dim);white-space:nowrap;line-height:1}
  .xs{width:13px;height:13px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
  .beta{flex:none;padding:5px 10px;border:1px dashed var(--dim);border-radius:999px;font-size:12px;font-weight:700;color:var(--ink)}
  .nav{display:flex;gap:8px;align-items:center}
  .nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--faint);background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:420px){.bar{padding:12px}.brand{gap:9px}.logo{width:32px;height:32px}.wm b{font-size:17px}}

  main{flex:1;width:100%;max-width:540px;padding:20px 16px 8px}
  .mn{font-family:'Noto Sans Mongolian',serif;writing-mode:vertical-lr;-webkit-writing-mode:vertical-lr;text-orientation:sideways}
  .modes{display:grid;gap:10px}
  .mode{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--faint);border-radius:12px;background:var(--cell);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .2s}
  .mode:hover{border-color:var(--dim)}
  .mode .mn{font-size:38px;line-height:1;flex:none;width:52px;height:92px;display:grid;place-items:center}
  .mode b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .mode small{display:block;margin-top:4px;font-size:13.5px;color:var(--dim);line-height:1.4}
  .mode .best{margin-top:6px;font-size:12px;font-weight:700;color:var(--ok)}
  .intro{margin:4px 0 18px;font-size:15px;line-height:1.55;color:var(--dim)}
  .intro b{color:var(--ink)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;font-weight:700}
  .top .back{background:none;border:0;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .prog{height:6px;border-radius:999px;background:var(--faint);overflow:hidden;margin-bottom:18px}
  .prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
  .stage{display:grid;place-items:center;min-height:250px;padding:18px;border-radius:14px;background:var(--cell);margin-bottom:12px}
  .stage .mn{font-size:86px;line-height:1.15;color:var(--ink)}
  .stage .mn.word{font-size:72px}
  .q{text-align:center;font-size:15px;color:var(--dim);margin-bottom:12px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{height:58px;border-radius:10px;border:1px solid var(--faint);background:none;color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
  .opt:hover:not(:disabled){border-color:var(--ink)}
  .opt.ok{background:var(--ink);color:#000;border-color:var(--ink)}
  .opt.no{border-color:var(--no);color:var(--no);text-decoration:line-through}
  .opt:disabled{cursor:default}
  .note{min-height:48px;margin-top:12px;font-size:14px;line-height:1.5;color:var(--dim);text-align:center}
  .note b{color:var(--ink)}
  .next{display:block;width:100%;height:50px;margin-top:6px;border-radius:10px;border:0;background:var(--ink);color:#000;font-size:16px;font-weight:800;cursor:pointer}
  .next[hidden]{display:none}
  .done{text-align:center;padding:26px 18px;border-radius:14px;background:var(--ink);color:#000}
  .done .big{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .done p{margin-top:10px;font-size:15px;color:rgba(0,0,0,.7)}
  .done .row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .done button{height:46px;padding:0 18px;border-radius:8px;border:1px solid #000;font-size:15px;font-weight:700;cursor:pointer}
  .done .a{background:#000;color:var(--ink)}.done .b{background:transparent;color:#000}
  .missed{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .missed span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.07);font-size:14px;font-weight:600}
  .missed .mn{font-size:22px;height:52px}
  .foot{font-size:11.5px;color:var(--dim);text-align:center;margin:18px 0 10px;line-height:1.6}
  .foot a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  /* alphabet sheet */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:30}
  .overlay.open{display:flex}
  .sheet{position:relative;background:var(--ink);color:#000;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:28px 22px 26px;border-radius:14px 14px 0 0}
  @media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:14px}}
  .close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:transparent;font-size:15px;cursor:pointer;color:#000}
  .eyebrow{font-size:11.5px;font-weight:600;color:rgba(0,0,0,.5);margin-bottom:6px}
  .sheet h2{font-weight:800;font-size:30px;letter-spacing:-.05em;line-height:1;text-transform:uppercase;margin-bottom:12px;padding-right:44px}
  .sheet p{font-size:14.5px;line-height:1.55;color:rgba(0,0,0,.75)}
  .abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:14px}
  .abc div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.06)}
  .abc .mn{font-size:30px;height:54px;color:#000}
  .abc b{font-size:16px}
</style>
</head>

L65 29.7L63.4 30.9L63.4 31.6L64.1 31.6L64.4 30.6L65 30.6L65 30L65.6 30L65.6 29.4L66.3 29.4L66.3 28.8L69.4 25.6L70.6 25.6L71.3 26.6L71.9 26.6L73.4 28.1L73.4 28.8L75 30L75 30.6L75.6 30.6L75.6 31.3L76.6 31.9L76.9 32.8L75 33.8L74.7 34.4L74.1 34.4L73.8 35L72.8 35L72.5 35.6L71.3 35.9L70 37.2L69.1 37.2L69.1 37.8L70 37.8L70.3 37.2L72.5 36.6L72.8 35.9L76.6 34.4L76.9 33.8L77.8 33.8L78.4 35.3L79.4 35.9L82.2 42.5L80.6 42.8L80 43.4L77.5 43.8L76.9 44.4L75.3 44.4L74.7 45L73.1 45L72.8 45.6L74.7 45.6L75.3 45L77.5 45L78.4 44.4L80.3 44.4L81.3 43.8L82.5 43.8L82.8 45.9L83.4 46.9L84.1 52.5L83.8 52.8L74.1 52.8L73.8 53.4L83.8 54.1L84.1 57.2L83.4 58.4L83.4 60.9L83.1 60.9L82.8 62.8L79.4 62.2L79.4 61.9L77.2 61.6L77.2 61.3L75.3 61.3L75 60.6L73.4 60.9L74.1 61.6L75.3 61.6L77.8 62.8L79.4 62.8L79.7 63.4L81.3 63.4L82.2 64.1L82.2 65.3L81.9 65.3L81.9 66.3L81.3 66.6L81.3 67.8L80.6 68.1L80 70.6L79.4 70.9L78.4 72.8L77.2 72.8L75 70.9L72.8 70L71.3 68.4L70.3 68.4L71.6 70L72.2 70L72.8 70.9L73.4 70.9L74.4 72.2L75 72.2L75.9 73.4L77.2 74.1L77.2 75L71.3 81.3L70.6 81.3L69.1 79.7L69.1 79.1L67.2 77.5L67.2 76.9L65.6 75.6L65.6 75L64.4 74.4L65.6 76.9L66.6 77.5L67.2 79.1L69.1 80.9L69.4 82.5L68.4 82.8L68.4 83.4L67.8 83.4L66.6 84.7L61.6 87.2L61.6 95.6L85.6 95.6L86.3 95L87.5 95L87.8 94.4L90.9 92.8L92.2 91.6L92.2 90.9L92.8 90.6L92.8 90L93.4 89.7L94.7 87.2L95 84.1L95.3 84.1L95.3 16.3L95 16.3L94.7 12.5L94.1 12.2L93.4 10L90 6.6L89.4 6.6L89.1 5.9L88.1 5.9L87.2 5L85.9 5L85.3 4.4Z" fill="#f4f2ed" fill-rule="evenodd"/></svg>

<main id="app"></main>

<div class="overlay" id="abcOv"><div class="sheet">
  <button class="close" data-close aria-label="Хаах">✕</button>
  <div class="eyebrow">Монгол бичиг</div>
  <h2>Цагаан толгой</h2>
  <p>Монгол бичгийг дээрээс доош, зүүнээс баруун тийш бичдэг. Нэг үсэг үгийн эхэнд, дунд, төгсгөлд өөр өөр хэлбэртэй болдог. Энд үсэг бүрийн ганцаарчилсан хэлбэрийг харуулав. “О, у”, “ө, ү” хос үсгийн хэлбэр ижил тул хамт бичсэн.</p>
  <div class="abc" id="abc"></div>
</div></div>

<script>
(function () {
  // Letters: the Mongolian script letter and its Cyrillic reading.
  // о/у and ө/ү look the same, so they are taught as one pair.
  const LETTERS = [
    ["ᠠ", "а"], ["ᠡ", "э"], ["ᠢ", "и"], ["ᠣ", "о / у"], ["ᠥ", "ө / ү"],
    ["ᠨ", "н"], ["ᠪ", "б"], ["ᠬ", "х"], ["ᠭ", "г"], ["ᠮ", "м"], ["ᠯ", "л"],
    ["ᠰ", "с"], ["ᠱ", "ш"], ["ᠲ", "т"], ["ᠳ", "д"], ["ᠴ", "ч"], ["ᠵ", "ж"],
    ["ᠶ", "й"], ["ᠷ", "р"],
  ];
  // Words in the classical spelling (written word, how it is read today, a short note when the spelling surprises).
  const WORDS = [
    ["ᠮᠣᠩᠭᠣᠯ", "монгол"], ["ᠮᠣᠷᠢ", "морь", "Бичихдээ “мори” гэж бичнэ."], ["ᠭᠡᠷ", "гэр"], ["ᠤᠰᠤ", "ус", "Бичихдээ “усу” гэж бичнэ."],
    ["ᠨᠠᠷᠠ", "нар", "Бичихдээ “нара” гэж бичнэ."], ["ᠰᠠᠷᠠ", "сар", "Бичихдээ “сара” гэж бичнэ."], ["ᠠᠭᠤᠯᠠ", "уул", "Бичихдээ “агула” гэж бичнэ."],
    ["ᠡᠵᠢ", "ээж", "Бичихдээ “эжи” гэж бичнэ."], ["ᠨᠣᠮ", "ном"], ["ᠬᠠᠭᠠᠨ", "хаан", "Бичихдээ “хаган” гэж бичнэ."],
    ["ᠲᠩᠷᠢ", "тэнгэр", "Бичихдээ “тнгри” гэж эгшиггүй бичдэг онцлогтой."], ["ᠮᠣᠳᠣ", "мод", "Бичихдээ “модо” гэж бичнэ."],
    ["ᠨᠠᠭᠤᠷ", "нуур", "Бичихдээ “нагур” гэж бичнэ."], ["ᠬᠣᠨᠢ", "хонь"], ["ᠲᠡᠮᠡᠭᠡ", "тэмээ", "Бичихдээ “тэмэгэ” гэж бичнэ."],
    ["ᠦᠬᠡᠷ", "үхэр"], ["ᠨᠣᠬᠠᠢ", "нохой"], ["ᠰᠦᠨ", "сүү", "Бичихдээ “сүн” гэж бичнэ."], ["ᠴᠠᠢ", "цай"],
    ["ᠪᠢᠴᠢᠭ", "бичиг"], ["ᠰᠤᠷᠭᠠᠭᠤᠯᠢ", "сургууль", "Бичихдээ “сургагули” гэж бичнэ."], ["ᠨᠥᠬᠥᠷ", "нөхөр"],
    ["ᠬᠦᠮᠦᠨ", "хүн", "Бичихдээ “хүмүн” гэж бичнэ."], ["ᠡᠬᠡ", "эх"], ["ᠨᠤᠲᠤᠭ", "нутаг", "Бичихдээ “нутуг” гэж бичнэ."],
    ["ᠤᠯᠤᠰ", "улс", "Бичихдээ “улус” гэж бичнэ."], ["ᠬᠣᠲᠠ", "хот"], ["ᠴᠡᠴᠡᠭ", "цэцэг"], ["ᠡᠪᠦᠯ", "өвөл", "Бичихдээ “эбүл” гэж бичнэ."],
    ["ᠵᠤᠨ", "зун"], ["ᠬᠠᠪᠤᠷ", "хавар", "Бичихдээ “хабур” гэж бичнэ."], ["ᠨᠠᠮᠤᠷ", "намар", "Бичихдээ “намур” гэж бичнэ."],
    ["ᠣᠳᠤ", "од"], ["ᠭᠠᠯ", "гал"], ["ᠰᠠᠯᠬᠢ", "салхи"], ["ᠬᠠᠳᠠᠭ", "хадаг"], ["ᠠᠢᠷᠠᠭ", "айраг"], ["ᠡᠷᠳᠡᠮ", "эрдэм"],
    ["ᠰᠠᠶᠢᠨ", "сайн", "Бичихдээ “саин” гэж бичнэ."], ["ᠪᠠᠶᠠᠷ", "баяр"], ["ᠪᠠᠭᠠᠲᠤᠷ", "баатар", "Бичихдээ “багатур” гэж бичнэ."],
    ["ᠠᠯᠲᠠᠨ", "алтан"], ["ᠲᠥᠷᠦ", "төр"], ["ᠲᠠᠯᠠ", "тал"], ["ᠭᠣᠪᠢ", "говь"], ["ᠬᠠᠩᠭᠠᠢ", "хангай"],
    ["ᠴᠢᠯᠠᠭᠤ", "чулуу", "Бичихдээ “чилагу” гэж бичнэ."], ["ᠪᠥᠬᠡ", "бөх"], ["ᠰᠤᠮᠤ", "сум"], ["ᠨᠤᠮᠤ", "нум"],
    ["ᠬᠤᠭᠤᠷ", "хуур", "Бичихдээ “хугур” гэж бичнэ."], ["ᠮᠥᠩᠬᠡ", "мөнх"],
  ];
  const N = 10;
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const MODES = {
    letters: { title: "Үсэг таних", sub: "Монгол бичгийн үсгийг кирилл үсэгтэй нь тааруулна.", sample: "ᠠ", pool: LETTERS.map(([m, c]) => ({ m, c })) },
    words: { title: "Үг унших", sub: "Монгол бичгээр бичсэн энгийн үгийг уншина. Зарим үг бичихдээ өөрөөр бичигддэгийг мэдэж аваарай.", sample: "ᠮᠣᠩᠭᠣᠯ", pool: WORDS.map(([m, c, n]) => ({ m, c, n })) },
  };
  let G = null;

  function menu() {
    app.innerHTML = `<p class="intro"><b>Монгол бичгээ уншиж сурцгаая.</b> Нэг удаад ${N} асуулт. Мэдэхгүй бол дээд талын ном хэлбэртэй товчоор цагаан толгойг хараарай.</p>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => {
        const best = store.get("mb_best_" + k);
        return `<button class="mode" data-mode="${k}"><span class="mn">${m.sample}</span><span><b>${m.title}</b><small>${m.sub}</small>${best != null ? `<span class="best">Таны дээд амжилт: ${best}/${N}</span>` : ""}</span></button>`;
      }).join("")}</div>
      <div class="foot">Энэ бол туршилтын хувилбар. Оноо онооны самбарт одоохондоо тоологдохгүй.<br>Санал, алдаа олсон бол <a href="mailto:gritedu22@gmail.com?subject=%D0%9C%D0%BE%D0%BD%D0%B3%D0%BE%D0%BB%20%D0%B1%D0%B8%D1%87%D0%B8%D0%B3%20(%D1%82%D1%83%D1%80%D1%88%D0%B8%D0%BB%D1%82)">бидэнд бичээрэй</a>. · <a href="/culture/">GRIT Culture</a></div>`;
    app.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => start(b.dataset.mode)));
  }

  function start(mode) {
    const pool = MODES[mode].pool;
    G = { mode, list: shuffle(pool).slice(0, N), i: 0, score: 0, missed: [] };
    ask();
  }

  function ask() {
    const it = G.list[G.i], pool = MODES[G.mode].pool;
    const wrong = shuffle(pool.filter((x) => x.c !== it.c)).slice(0, 3).map((x) => x.c);
    const opts = shuffle([it.c, ...wrong]);
    app.innerHTML = `<div class="top"><span>${MODES[G.mode].title}</span><span>${G.i + 1}/${N}</span><button class="back" id="quit">Гарах</button></div>
      <div class="prog"><i style="width:${(G.i / N) * 100}%"></i></div>
      <div class="stage"><span class="mn${G.mode === "words" ? " word" : ""}">${it.m}</span></div>
      <p class="q">${G.mode === "words" ? "Энэ ямар үг вэ?" : "Энэ ямар үсэг вэ?"}</p>
      <div class="opts">${opts.map((o) => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <p class="note" id="note"></p>
      <button class="next" id="next" hidden>${G.i + 1 < N ? "Дараагийнх" : "Дүнгээ харах"}</button>`;
    document.getElementById("quit").addEventListener("click", menu);
    app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(b)));
    document.getElementById("next").addEventListener("click", () => { G.i++; G.i < N ? ask() : finish(); });
  }

  function answer(btn) {
    const it = G.list[G.i], right = btn.dataset.v === it.c;
    app.querySelectorAll(".opt").forEach((b) => { b.disabled = true; if (b.dataset.v === it.c) b.classList.add("ok"); });
    if (right) G.score++; else { btn.classList.add("no"); G.missed.push(it); }
    const note = document.getElementById("note");
    note.innerHTML = (right ? "<b>Зөв!</b> " : `<b>Зөв хариу: ${esc(it.c)}.</b> `) + (it.n ? esc(it.n) : "");
    if (navigator.vibrate) navigator.vibrate(right ? 15 : [30, 40, 30]);
    const nx = document.getElementById("next"); nx.hidden = false; nx.focus();
  }

  function finish() {
    const key = "mb_best_" + G.mode, best = store.get(key);
    if (best == null || G.score > best) store.set(key, G.score);
    const msg = G.score === N ? "Гайхалтай! Бүгдийг нь зөв уншлаа." : G.score >= 7 ? "Сайн байна! Бага зэрэг дасгал хийвэл бүгдийг нь зөв уншина." : "Дахин оролдоод үзээрэй. Цагаан толгой туслана.";
    app.innerHTML = `<div class="done"><div class="big">${G.score}/${N}</div><p>${msg}</p>
      ${G.missed.length ? `<p style="margin-top:14px;font-weight:700;color:#000">Алдсан ${G.mode === "words" ? "үгс" : "үсгүүд"}</p><div class="missed">${G.missed.map((x) => `<span><span class="mn">${x.m}</span>${esc(x.c)}</span>`).join("")}</div>` : ""}
      <div class="row"><button class="a" id="again">Дахин тоглох</button><button class="b" id="home">Буцах</button></div></div>`;
    document.getElementById("again").addEventListener("click", () => start(G.mode));
    document.getElementById("home").addEventListener("click", menu);
  }

  document.getElementById("abc").innerHTML = LETTERS.map(([m, c]) => `<div><span class="mn">${m}</span><b>${c}</b></div>`).join("");
  const ov = document.getElementById("abcOv");
  document.getElementById("abcBtn").addEventListener("click", () => ov.classList.add("open"));
  ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest("[data-close]")) ov.classList.remove("open"); });
  // draw only once the Mongolian font is here, so the letters never flash in a fallback font
  const ready = document.fonts && document.fonts.load ? document.fonts.load('40px "Noto Sans Mongolian"', "ᠮᠣᠩᠭᠣᠯ").catch(() => {}) : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 2500))]).then(menu);
})();
</script>
